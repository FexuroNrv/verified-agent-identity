name: Verify Human Identity

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # 🔍 DEBUG: cek clawhub dulu
      - name: Debug ClawHub availability
        run: |
          echo "Checking clawhub..."
          npx clawhub@latest --version || true

      # 🔧 COBA install (dengan fallback versi lama)
      - name: Install ClawHub skill (try latest)
        run: |
          npx clawhub@latest install verified-agent-identity || echo "Latest failed"

      - name: Install ClawHub skill (fallback version)
        run: |
          npx clawhub@0.7.0 install verified-agent-identity || echo "Fallback failed"

      # 🔍 CEK folder scripts ada atau tidak
      - name: Check scripts folder
        run: |
          ls -la
          ls -la scripts || echo "scripts folder not found"

      # 🔧 Install dependency kalau ada
      - name: Install script dependencies
        run: |
          if [ -d "scripts" ]; then
            cd scripts
            npm install
          else
            echo "No scripts folder, skip"
          fi

      # 🔧 Run identity kalau file ada
      - name: Create Ethereum Identity
        run: |
          if [ -f "scripts/createNewEthereumIdentity.js" ]; then
            node scripts/createNewEthereumIdentity.js
          else
            echo "Script not found, skip"
          fi

      - name: Link Human to Agent
        run: |
          if [ -f "scripts/manualLinkHumanToAgent.js" ]; then
            node scripts/manualLinkHumanToAgent.js \
            --challenge '{"name": "FexuroNRV", "description": "FexuroNRV AI Agent"}'
          else
            echo "Script not found, skip"
          fi
